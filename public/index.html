<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ilumina</title>
  <meta name="description" content="Asistente incluyente con IA (Gemini)." />
  <meta name="theme-color" content="#B4121B" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <header class="top">
    <div class="brand">
      <img src="/icons/icon.svg" alt="" width="36" height="36" />
      <div>
        <h1 id="app-name">Ilumina</h1>
        <p id="app-tagline" class="tagline"></p>
      </div>
    </div>
    <nav class="a11y" aria-label="Accesibilidad">
      <button type="button" id="font-down" aria-label="Letra más pequeña">A−</button>
      <button type="button" id="font-up" aria-label="Letra más grande">A+</button>
      <button type="button" id="contrast" aria-pressed="false" aria-label="Alto contraste">🌓</button>
      <button type="button" id="easy" aria-pressed="false" title="Lectura fácil">Fácil</button>
      <button type="button" id="autoread" aria-pressed="false" title="Leer respuestas en voz alta">🔊</button>
    </nav>
  </header>

  <div id="demo-banner" class="banner" hidden role="status">
    Modo demo: falta configurar la API key de Gemini. La interfaz funciona, pero las respuestas son de ejemplo.
  </div>

  <main id="main">
    <section aria-labelledby="tasks-h">
      <h2 id="tasks-h" class="sr-only">¿Qué quieres hacer?</h2>
      <div id="tasks" class="tasks" role="radiogroup" aria-label="Funciones"></div>
    </section>

    <form id="ask" class="card" autocomplete="off">
      <label for="prompt" id="task-desc" class="task-desc"></label>
      <div class="input-row">
        <textarea id="prompt" rows="3"></textarea>
      </div>

      <div id="image-zone" class="image-zone">
        <input type="file" id="file" accept="image/*" capture="environment" hidden />
        <button type="button" id="camera" class="secondary">📷 Foto o imagen</button>
        <div id="preview" class="preview" hidden>
          <img id="preview-img" alt="Imagen seleccionada" />
          <button type="button" id="remove-img" class="link">Quitar imagen</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="mic" class="secondary" aria-pressed="false">🎤 Dictar</button>
        <button type="submit" id="send" class="primary">Preguntar a Gemini</button>
      </div>
      <div id="examples" class="examples" aria-label="Ejemplos"></div>
    </form>

    <section id="result" class="result" aria-live="polite" aria-busy="false" tabindex="-1"></section>

    <form id="followup" class="card followup" hidden autocomplete="off">
      <label for="follow-prompt">¿Tienes otra duda sobre esto?</label>
      <div class="input-row">
        <input id="follow-prompt" type="text" placeholder="Escribe tu siguiente pregunta" />
        <button type="submit" class="primary">Enviar</button>
      </div>
    </form>
  </main>

  <footer class="foot">
    <p id="ods" class="ods"></p>
    <p id="disclaimer" class="small"></p>
    <p class="small">Impulsado por <strong>Gemini</strong> · <span id="team"></span></p>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
